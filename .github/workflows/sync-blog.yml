name: Sync Substack Blog

on:
  schedule:
    # Run twice daily at 06:00 and 18:00 UTC
    - cron: '0 6,18 * * *'
  # Allow manual trigger from GitHub Actions tab
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-blog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Substack sync script
        run: |
          python scripts/sync_substack.py

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add blog/ blog.html scripts/posts_cache.json
          if git diff --staged --quiet; then
            echo "No changes found. Blog is up to date."
          else
            git commit -m "chore(blog): sync articles from Substack [skip ci]"
            git push
          fi
