                        <path d="M99.7,76.4L59.9,7.5C59.5,6.8 58.7,6.4 57.9,6.4L42,6.4C41.2,6.4 40.4,6.8 40,7.5L0.3,76.4C-0.1,77.1 -0.1,78 0.3,78.7L8.3,92.5C8.7,93.2 9.5,93.6 10.3,93.6L89.8,93.6C90.6,93.6 91.4,93.2 91.8,92.5L99.8,78.7C100.1,78 100.1,77.1 99.7,76.4ZM43.4,11L54,11L24.2,62.6C23.8,63.3 23.8,64.2 24.2,64.9C24.6,65.6 25.4,66 26.2,66L56.7,66L62,75.2L6.3,75.2L43.4,11ZM50,54.6L54,61.5L46,61.5L50,54.6ZM6.3,79.8L65.9,79.8C66.7,79.8 67.5,79.4 67.9,78.7C68.3,78 68.3,77.1 67.9,76.4L52.7,50L58,40.8L85.8,89L11.6,89L6.3,79.8ZM89.8,86.7L59.9,35.1C59.5,34.4 58.7,34 57.9,34C57.1,34 56.3,34.4 55.9,35.1L40.7,61.5L30.1,61.5L58,13.3L95.1,77.6L89.8,86.7Z" fill="#f8fafc" fill-rule="nonzero"/>

        <!-- Markdown Content Container -->
        <div id="content" class="md-content">
            <p style="text-align: center; color: var(--text-secondary);">Loading content...</p>
        </div>

        <!-- Footer -->
        <footer>
            <div class="footer-content" style="justify-content: center;">
                <div class="footer-links" style="gap: 4rem;">
                    <a href="page.html?md=contact" style="color: var(--text-secondary); font-size: 0.9rem;">Contact</a>
                    <a href="page.html?md=terms" style="color: var(--text-secondary); font-size: 0.9rem;">Terms of Service</a>
                    <a href="page.html?md=privacy" style="color: var(--text-secondary); font-size: 0.9rem;">Privacy Policy</a>
                    <a href="page.html?md=refund" style="color: var(--text-secondary); font-size: 0.9rem;">Refund Policy</a>
                </div>
            </div>
            <p style="text-align: center; margin-top: 2rem; font-size: 0.85rem; color: var(--text-secondary);">
                &copy; 2026 rolv technologies LLC. All rights reserved.
            </p>
        </footer>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const urlParams = new URLSearchParams(window.location.search);
            let mdFile = urlParams.get('md');
            const contentDiv = document.getElementById('content');

            // Default to contact if no file is specified
            if (!mdFile) {
                mdFile = 'contact';
            }

            // Simple security check to only allow specific files
            const allowedFiles = ['terms', 'privacy', 'refund', 'contact'];
            if (!allowedFiles.includes(mdFile)) {
                contentDiv.innerHTML = '<p style="color: #ef4444;">Error: Invalid file requested.</p>';
                return;
            }

            try {
                const response = await fetch(`${mdFile}.md`);
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                const markdown = await response.text();
                
                // Parse markdown to HTML
                contentDiv.innerHTML = marked.parse(markdown);
                
                // Update document title based on first h1 if it exists
                const h1 = contentDiv.querySelector('h1');
                if (h1) {
                    document.title = `rolv - ${h1.textContent}`;
                }
            } catch (error) {
                contentDiv.innerHTML = `<p style="color: #ef4444;">Error loading content: ${error.message}</p>`;
            }
        });
    </script>
</body>
</html>
